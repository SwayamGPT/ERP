[package]
name = "hisaab"
version = "0.1.0"
description = "Hisaab — billing, stock & GST for Indian retail and wholesale"
edition = "2021"

[workspace]
members = [".", "hw"]

[lib]
name = "hisaab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hisaab-hw = { path = "hw" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
