name: Desktop build

# Builds the Hisaab desktop installers:
#   Windows → .exe (NSIS setup) and .msi
#   macOS   → .dmg (universal: Apple Silicon + Intel)
# Runs on every push (any branch), on pull requests, and on demand from the Actions tab.
# Every run uploads the installers as workflow artifacts. Pushing a tag like v0.1.0
# also attaches them to a draft GitHub Release.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create the draft release on tags

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Performance budget (bill save < 50 ms at 50k items / 100k bills)
        run: npm run perf

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust-targets: ''
            args: '--bundles nsis,msi'
            artifact: hisaab-windows
            paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin --bundles dmg'
            artifact: hisaab-macos
            paths: |
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # npx, not "npm run": tauri-action adds its own "--" for npm, which sent the flags to cargo.
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # Only publish a (draft) release for version tags; other runs just upload artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Hisaab {0}', github.ref_name) || '' }}
          releaseBody: 'Windows: run the .exe setup (or .msi). macOS: open the .dmg and drag Hisaab to Applications.'
          releaseDraft: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30
