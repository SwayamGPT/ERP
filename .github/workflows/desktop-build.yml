name: Desktop build

# Builds the Hisaab desktop installers:
#   Windows → .exe (NSIS setup) and .msi
#   macOS   → .dmg (universal: Apple Silicon + Intel)
# Runs on every push (any branch), on pull requests, and on demand from the Actions tab.
# Every push publishes the installers to the public "latest-build" release (downloadable without
# a GitHub login); a tag like v0.1.0 publishes the release "Hisaab v0.1.0". They are also kept as
# workflow artifacts (those need a login).

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/core/**'
      - 'server/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish the installers on a public GitHub Release

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Performance budget (bill save < 50 ms at 50k items / 100k bills)
        run: npm run perf
      - uses: dtolnay/rust-toolchain@stable
      - name: Counter hardware (printing, scale, file storage) — Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/hw/Cargo.toml

  server:
    name: Cloud server & browser journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hisaab
          POSTGRES_PASSWORD: hisaab
          POSTGRES_DB: hisaab_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HISAAB_TEST_DB: postgres://hisaab:hisaab@localhost:5432/hisaab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Go tests (API, validation, golden GST fixtures)
        working-directory: server
        run: go vet ./... && go test -count=1 -p 1 ./...
      - name: Desktop sync engine against the real server
        run: npx vitest run apps/desktop/test/sync.server.test.ts
      - name: Browser journeys (incl. two counters syncing through the server)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --trace off

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust-targets: ''
            args: '--bundles nsis,msi'
            artifact: hisaab-windows
            paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin --bundles dmg'
            artifact: hisaab-macos
            paths: |
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # npx, not "npm run": tauri-action adds its own "--" for npm, which sent the flags to cargo.
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # Releases are published by the next step, under fixed file names.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30

      # Public download, no GitHub login: fixed names, so the links never change.
      - name: Publish to the public release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-release
          if [ "${{ matrix.name }}" = "Windows" ]; then
            cp "$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)" dist-release/Hisaab-Setup-Windows.exe
            cp "$(ls apps/desktop/src-tauri/target/release/bundle/msi/*.msi | head -1)" dist-release/Hisaab-Windows.msi
          else
            cp "$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)" dist-release/Hisaab-macOS.dmg
          fi
          bash .github/scripts/publish-release.sh dist-release/*
